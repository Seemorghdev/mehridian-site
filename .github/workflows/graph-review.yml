name: Review graph infrastructure
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare pinned engine
        run: |
          git clone https://github.com/jackyzha0/quartz.git quartz-engine
          git -C quartz-engine checkout 9cf87ff1c248a8ca551093214b0fec3b31415009
          cp quartz.config.yaml quartz.lock.json quartz-engine/
      - name: Install engine and pinned plugins
        working-directory: quartz-engine
        run: |
          npm ci
          npx quartz plugin install
      - name: Build reviewed source
        run: |
          npm ci --prefix theme/graph
          node scripts/build-graph.mjs
          node --test theme/*.test.mjs
      - name: Rehearse production build without deploying
        working-directory: quartz-engine
        run: npx quartz build -d "$GITHUB_WORKSPACE/content" -o "$GITHUB_WORKSPACE/preview"
      - name: Check curated output
        run: |
          node scripts/copy-graph-assets.mjs
          node scripts/check-build.mjs
          node scripts/check-connected-notes.mjs
          node scripts/check-garden.mjs
