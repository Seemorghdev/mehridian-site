<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0 0 720 306" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Each stronger question drops to one or zero</title>
  <desc id="d">Of 15 repositories, 13 had a passing check on the exact candidate, 1 had recorded acceptance, 0 had whole-candidate source lineage. Of 25 published surfaces, 0 had an independent runtime observation.</desc>
  <rect width="720" height="306" fill="#ffffff"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#1c1f23">Each stronger question drops to one or zero</text>
  <text x="24" y="54" font-size="12" fill="#5d646d">Project 03, frozen comparison. Bars show the share answering yes.</text>

  <g font-size="13" fill="#1c1f23">
    <text x="24" y="98">Checks on the exact candidate passed</text>
    <text x="24" y="148">…and acceptance was recorded</text>
    <text x="24" y="198">Whole candidate traced to its source</text>
    <text x="24" y="248">Surface independently seen running</text>
  </g>

  <g>
    <rect x="300" y="84" width="320" height="20" fill="#eef0f2"/>
    <rect x="300" y="84" width="277.3" height="20" fill="#1c1f23"/>
    <rect x="300" y="134" width="320" height="20" fill="#eef0f2"/>
    <rect x="300" y="134" width="21.3" height="20" fill="#1c1f23"/>
    <rect x="300" y="184" width="320" height="20" fill="#eef0f2"/>
    <rect x="300" y="234" width="320" height="20" fill="#eef0f2"/>
  </g>

  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1c1f23">
    <text x="632" y="99">13 / 15</text>
    <text x="632" y="149">1 / 15</text>
    <text x="632" y="199">0 / 15</text>
    <text x="632" y="249">0 / 25</text>
  </g>
  <text x="24" y="282" font-size="11" fill="#5d646d">Rows 1–3 count repositories; row 4 counts published surfaces.</text><text x="24" y="298" font-size="11" fill="#5d646d">A zero means not established, not failed.</text>
</svg>
