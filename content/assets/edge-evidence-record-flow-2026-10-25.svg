<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Where each Edge Evidence record is written</title>
  <desc id="d">Capture writes a PREPARED intent per source occurrence, ending COMPLETE or GAP. The Processor commits a PREPARED job with a deterministic ID before publishing, publishes with no-replace links, and defers if the spool is locked. Replication re-hashes the source, then creates the object, adopts an exact existing copy, or refuses a different one with exit code 4. A separate read-only verify reads the target back; only then is the replica VERIFIED.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c1f23"/></marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="600" fill="#1c1f23">Where each record is written</text>
  <text x="24" y="52" font-size="12" fill="#5d646d">Each worker keeps its own record, so "processed" and "the copy matches" stay separate facts.</text>

  <g fill="none" stroke="#1c1f23" stroke-width="1">
    <rect x="24" y="76" width="160" height="96"/>
    <rect x="212" y="76" width="160" height="96"/>
    <rect x="400" y="76" width="160" height="96"/>
    <rect x="588" y="76" width="148" height="96"/>
  </g>
  <g stroke="#1c1f23" stroke-width="1" marker-end="url(#a)">
    <line x1="184" y1="124" x2="210" y2="124"/>
    <line x1="372" y1="124" x2="398" y2="124"/>
    <line x1="560" y1="124" x2="586" y2="124"/>
  </g>

  <g font-size="13" font-weight="600" fill="#1c1f23">
    <text x="36" y="98">Capture</text>
    <text x="224" y="98">Processor</text>
    <text x="412" y="98">Replication</text>
    <text x="600" y="98">Verify (read-only)</text>
  </g>
  <g font-size="11" fill="#1c1f23">
    <text x="36" y="118">per source occurrence</text>
    <text x="36" y="134">writes intent first</text>
    <text x="224" y="118">deterministic job ID</text>
    <text x="224" y="134">record before publish</text>
    <text x="224" y="150">no-replace links, fsync</text>
    <text x="412" y="118">re-hashes local source</text>
    <text x="412" y="134">then checks destination</text>
    <text x="600" y="118">reads the target back</text>
    <text x="600" y="134">compares size + digest</text>
  </g>

  <g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="24" y="190" width="160" height="22" fill="#eef0f2"/><text x="32" y="205" fill="#1c1f23">PREPARED</text>
    <rect x="24" y="216" width="160" height="22" fill="#1c1f23"/><text x="32" y="231" fill="#ffffff">COMPLETE</text>
    <rect x="24" y="242" width="160" height="22" fill="#ffffff" stroke="#1c1f23" stroke-dasharray="3 2"/><text x="32" y="257" fill="#1c1f23">GAP (source lost)</text>

    <rect x="212" y="190" width="160" height="22" fill="#eef0f2"/><text x="220" y="205" fill="#1c1f23">PREPARED → same job ID</text>
    <rect x="212" y="216" width="160" height="22" fill="#1c1f23"/><text x="220" y="231" fill="#ffffff">published</text>
    <rect x="212" y="242" width="160" height="22" fill="#ffffff" stroke="#1c1f23" stroke-dasharray="3 2"/><text x="220" y="257" fill="#1c1f23">deferred (spool locked)</text>

    <rect x="400" y="190" width="160" height="22" fill="#1c1f23"/><text x="408" y="205" fill="#ffffff">absent → create</text>
    <rect x="400" y="216" width="160" height="22" fill="#1c1f23"/><text x="408" y="231" fill="#ffffff">exact copy → adopt</text>
    <rect x="400" y="242" width="160" height="22" fill="#ffffff" stroke="#1c1f23" stroke-dasharray="3 2"/><text x="408" y="257" fill="#1c1f23">different → exit 4</text>

    <rect x="588" y="190" width="148" height="22" fill="#1c1f23"/><text x="596" y="205" fill="#ffffff">VERIFIED</text>
    <rect x="588" y="216" width="148" height="22" fill="#eef0f2"/><text x="596" y="231" fill="#1c1f23">PENDING</text>
  </g>

  <g font-size="11" fill="#5d646d">
    <rect x="24" y="290" width="14" height="10" fill="#1c1f23"/><text x="44" y="299">recorded outcome</text>
    <rect x="160" y="290" width="14" height="10" fill="#eef0f2"/><text x="180" y="299">intermediate record a later run can finish</text>
    <rect x="440" y="290" width="14" height="10" fill="#ffffff" stroke="#1c1f23" stroke-dasharray="3 2"/><text x="460" y="299">kept as a limitation or refusal, not hidden</text>
    <text x="24" y="330">States are the ones the workers record. The hosted demo shows retained synthetic results; it does not run these workers.</text>
  </g>
</svg>
