<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">OPBD-2: the measurement that changed the harness</title>
  <desc id="d">The harness allowed 240 seconds for reconciliation. A benchmark measured canonical reconciliation at about 270 seconds, so the first attempt timed out. The budget was raised to 600 seconds and the run restarted on fresh state.</desc>
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="600" fill="#1c1f23">The measurement that changed the harness</text>
  <text x="24" y="52" font-size="12" fill="#5d646d">OPBD-2 reconciliation time against the harness's control timeout, in seconds (0–600).</text>

  <g font-size="13" fill="#1c1f23">
    <text x="24" y="98">Original timeout</text>
    <text x="24" y="138">Measured reconciliation</text>
    <text x="24" y="178">Corrected budget</text>
  </g>
  <g>
    <rect x="200" y="84" width="420" height="20" fill="#eef0f2"/>
    <rect x="200" y="84" width="168" height="20" fill="#8a929b"/>
    <rect x="200" y="124" width="420" height="20" fill="#eef0f2"/>
    <rect x="200" y="124" width="189" height="20" fill="#1c1f23"/>
    <rect x="200" y="164" width="420" height="20" fill="#eef0f2"/>
    <rect x="200" y="164" width="420" height="20" fill="#ffffff" stroke="#1c1f23"/>
  </g>
  <line x1="368" y1="74" x2="368" y2="196" stroke="#9b1c1c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="372" y="72" font-size="11" fill="#9b1c1c">240 s limit</text>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1c1f23">
    <text x="632" y="99">240 s</text>
    <text x="632" y="139">~270 s</text>
    <text x="632" y="179">600 s</text>
  </g>
  <g font-size="11" fill="#5d646d">
    <text x="200" y="210">0</text><text x="402" y="210">300</text><text x="604" y="210">600</text>
    <text x="24" y="236">The ~270 s value is one benchmark on a scratch copy, not a distribution. The corrected run restarted on fresh state.</text>
  </g>
</svg>
