<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Two external measurements of AI-assisted software work</title>
  <desc id="d">Left, METR 2025 randomised study of experienced open-source developers: developers expected AI tools to make them 24 percent faster; with the tools they took 19 percent longer. Right, DORA 2024: a 25 percent increase in AI adoption was associated with a 1.5 percent decrease in delivery throughput and a 7.2 percent decrease in delivery stability.</desc>
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="600" fill="#1c1f23">How it feels and what gets measured are different things</text>
  <text x="24" y="52" font-size="12" fill="#5d646d">Two external studies, shown for context. They are not measurements of the Project 03 repositories.</text>

  <!-- METR panel: axis at x=200, 3 px per percentage point -->
  <text x="24" y="86" font-size="12" font-weight="600" fill="#1c1f23">METR 2025 · experienced developers, own repositories</text>
  <text x="24" y="102" font-size="11" fill="#5d646d">Change in time to complete an issue with AI tools</text>
  <line x1="200" y1="112" x2="200" y2="206" stroke="#1c1f23"/>
  <text x="24" y="126" font-size="12" fill="#1c1f23">Expected by developers</text>
  <rect x="128" y="132" width="72" height="20" fill="#eef0f2" stroke="#8a929b"/>
  <text x="54" y="147" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1c1f23">24% faster</text>
  <text x="24" y="174" font-size="12" fill="#1c1f23">Measured</text>
  <rect x="200" y="180" width="57" height="20" fill="#1c1f23"/>
  <text x="264" y="195" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1c1f23">19% slower</text>
  <text x="144" y="222" font-size="10" fill="#5d646d">← faster</text><text x="206" y="222" font-size="10" fill="#5d646d">slower →</text>

  <!-- DORA panel: axis at x=620, 8 px per percentage point -->
  <text x="400" y="86" font-size="12" font-weight="600" fill="#1c1f23">DORA 2024 · per 25% increase in AI adoption</text>
  <text x="400" y="102" font-size="11" fill="#5d646d">Associated change in software delivery</text>
  <line x1="620" y1="112" x2="620" y2="206" stroke="#1c1f23"/>
  <text x="400" y="126" font-size="12" fill="#1c1f23">Delivery throughput</text>
  <rect x="608" y="132" width="12" height="20" fill="#8a929b"/>
  <text x="626" y="147" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1c1f23">−1.5%</text>
  <text x="400" y="174" font-size="12" fill="#1c1f23">Delivery stability</text>
  <rect x="562" y="180" width="58" height="20" fill="#1c1f23"/>
  <text x="626" y="195" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1c1f23">−7.2%</text>
  <text x="578" y="222" font-size="10" fill="#5d646d">← lower</text>

  <line x1="24" y1="244" x2="736" y2="244" stroke="#d6d9dd"/>
  <g font-size="11" fill="#5d646d">
    <text x="24" y="264">METR: randomised controlled trial, 16 developers, 246 issues. METR bars: 3 px per point; DORA bars: 8 px per point.</text>
    <text x="24" y="280">DORA: survey-based association across organisations, not a controlled experiment.</text>
    <text x="24" y="304">Sources: metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study · dora.dev/ai/gen-ai-report</text>
  </g>
</svg>
